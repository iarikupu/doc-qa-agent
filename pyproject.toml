[project]
name = "docqa"
version = "0.1.0"
description = "Document question-answering agent with OpenTelemetry tracing, an eval harness and tests"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
openai = ["openai>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
